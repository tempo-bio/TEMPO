name: Stimulation firmware

on:
  push:
    paths:
      - .github/workflows/stimulation-firmware.yml
      - firmware/tempo_pacer/**
      - tempo_firmware.py
      - tempo_stimulation.py
      - stimulation_investigation_1/**
      - tests/firmware/**
      - tests/test_pacer_firmware.py
  pull_request:
    paths:
      - .github/workflows/stimulation-firmware.yml
      - firmware/tempo_pacer/**
      - tempo_firmware.py
      - tempo_stimulation.py
      - stimulation_investigation_1/**
      - tests/firmware/**
      - tests/test_pacer_firmware.py
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-firmware:
    name: Test and compile both Uno R4 Minima firmware variants
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.16'
      - name: Check the firmware protocol and output state machine
        run: |
          g++ --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest -v tests.test_pacer_firmware
      - name: Compile pacing and investigation with TEMPO's pinned Arduino toolchain
        run: |
          Select-String -Path requirements-windows.lock -Pattern '^certifi @ ' |
            ForEach-Object { $_.Line } | Set-Content "$env:RUNNER_TEMP\tempo-certifi.txt"
          python -m pip install --no-deps --require-hashes -r "$env:RUNNER_TEMP\tempo-certifi.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import os
          from pathlib import Path
          import shutil
          from stimulation_investigation_1.firmware import development_sketch
          from tempo_firmware import FQBN, FirmwareInstaller

          root = Path(os.environ['RUNNER_TEMP'])
          installer = FirmwareInstaller(root / 'tempo-arduino', print)
          installer.prepare()
          payload = root / 'tempo-firmware'

          def compile_sketch(sketch):
              build = root / 'tempo-firmware-build' / sketch.name
              print(installer.run(['compile', '--fqbn', FQBN, '--warnings', 'all',
                                   '--build-path', str(root / 'tempo-firmware-cache' / sketch.name),
                                   '--output-dir', str(build), str(sketch)], timeout=300))
              destination = payload / sketch.name
              shutil.copytree(sketch, destination)
              shutil.copyfile(build / (sketch.name + '.ino.bin'), destination / (sketch.name + '.ino.bin'))

          compile_sketch(Path('firmware/tempo_pacer'))
          with development_sketch() as sketch:
              compile_sketch(sketch)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain the sketches and compiled firmware
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: TEMPO-Pacer-Uno-R4-Minima
          path: ${{ runner.temp }}/tempo-firmware
          if-no-files-found: error
          retention-days: 14
