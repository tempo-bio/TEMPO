name: Windows preflight

on:
  push:
    branches: [codex/tempo-v1.0.1-candidate]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  preflight:
    name: Check Windows launch and source contracts
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.13.16 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.16'
          architecture: x64
      - name: Check contracts without application dependencies
        run: |
          python -S -m unittest -v tests.test_assistance_launch tests.test_release_preflight
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare minimal process-control test environment
        run: |
          python -m venv "$env:RUNNER_TEMP\tempo-preflight-python"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c @'
          from pathlib import Path
          import os
          rows = [line for line in Path('requirements-windows.lock').read_text().splitlines()
                  if line.startswith('psutil @ ')]
          if len(rows) != 1 or ' --hash=sha256:' not in rows[0]:
              raise SystemExit('Expected one checksummed psutil requirement.')
          Path(os.environ['RUNNER_TEMP'], 'tempo-preflight-psutil.txt').write_text(rows[0] + '\n')
          '@
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\tempo-preflight-python\Scripts\python.exe" -m pip install --no-deps --require-hashes -r "$env:RUNNER_TEMP\tempo-preflight-psutil.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check actual Windows helper cancellation and cleanup
        run: |
          & "$env:RUNNER_TEMP\tempo-preflight-python\Scripts\python.exe" -m unittest -v tests.test_model_assistance_runtime.AssistanceRuntimeTests.test_cancel_stops_real_helper_descendants tests.test_model_assistance_runtime.AssistanceRuntimeTests.test_failed_parent_cannot_leave_a_running_helper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
