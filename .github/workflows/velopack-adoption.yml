name: Experimental Velopack recovery gate
on:
  workflow_dispatch:
    inputs:
      operations_only:
        description: 'Run only the small Windows filesystem experiments'
        required: false
        default: false
        type: boolean
      full_app_source_run_id:
        description: 'Optional completed Windows build run: replay its full-app payload instead of rebuilding native fixtures'
        required: false
        default: ''
        type: string
      uninstall_diagnostics:
        description: 'Read-only handle snapshots from the live fixture uninstaller; not acceptance evidence'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      uninstall_diagnostics:
        required: false
        default: false
        type: boolean
  push:
    branches:
      - v1.0.2-dev
permissions:
  contents: read
  actions: read
jobs:
  filesystem-operations:
    if: ${{ inputs.full_app_source_run_id == '' }}
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Exercise exact Rust filesystem operations
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          rustc --version --verbose | Tee-Object evidence/rustc.txt
          rustc --edition 2021 tests/fixtures/velopack/windows_fs_probe.rs -o evidence/windows-fs-probe.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & evidence/windows-fs-probe.exe evidence/operations | Tee-Object evidence/operations.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain filesystem experiment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: velopack-windows-filesystem-evidence
          retention-days: 7
          path: evidence
          if-no-files-found: error
  native-recovery:
    needs: filesystem-operations
    if: ${{ inputs.full_app_source_run_id == '' && !inputs.operations_only }}
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Preserve pinned checkout bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tempo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: velopack/velopack
          ref: 92d6a1c91716729d449034df5c50307dcce39493
          path: velopack
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          architecture: x64
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v4.3.1
        with:
          dotnet-version: '8.0.413'
      - name: Install hash-locked fixture dependencies
        shell: pwsh
        run: |
          python -m venv .venv_fixture
          & .venv_fixture/Scripts/python.exe -m pip install --require-hashes --no-deps -r tempo/tests/fixtures/velopack/requirements-windows.lock
          Add-Content $env:GITHUB_PATH "$pwd/.venv_fixture/Scripts"
      - name: Download pinned packager
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest 'https://github.com/velopack/velopack/releases/download/1.2.161/vpk.1.2.161.nupkg' -OutFile vpk.zip
          if ((Get-FileHash vpk.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '2b56ce117f803fc70c103cb423bd040e395e40370f6ff6e10818e9ff9c26a323') { throw 'Packager hash mismatch' }
          Expand-Archive vpk.zip -DestinationPath vpk
      - name: Prepare pinned source
        run: python tempo/scripts/prepare_velopack_updater.py velopack
      - name: Prepare read-only Windows handle diagnostics
        if: ${{ inputs.uninstall_diagnostics }}
        shell: pwsh
        run: |
          $ProgressPreference='SilentlyContinue'
          Invoke-WebRequest 'https://download.sysinternals.com/files/Handle.zip' -OutFile handle.zip
          if ((Get-FileHash handle.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '279aaf8eccb6f79147f4dcc6ba091fb895c4cb8b199a0dd186a4c76bc519d2cd') { throw 'Diagnostic archive hash mismatch' }
          Expand-Archive handle.zip -DestinationPath handle
          $nativeHandleTool=(Resolve-Path handle/handle64.exe).Path
          if ((Get-FileHash $nativeHandleTool -Algorithm SHA256).Hash.ToLowerInvariant() -ne '24bafcc570cc9bbb6b6e6652a57a519e0464e3996891aaba6f55299cce20b04f') { throw 'Diagnostic executable hash mismatch' }
          $signature=Get-AuthenticodeSignature -LiteralPath $nativeHandleTool
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(?:^|,\s*)O=Microsoft Corporation(?:,|$)') { throw 'Diagnostic publisher verification failed' }
          @{sha256=(Get-FileHash $nativeHandleTool -Algorithm SHA256).Hash;status=$signature.Status.ToString();subject=$signature.SignerCertificate.Subject;thumbprint=$signature.SignerCertificate.Thumbprint} |
            ConvertTo-Json | Set-Content handle-signature.json -Encoding utf8NoBOM
          Add-Content $env:GITHUB_ENV "TEMPO_FIXTURE_HANDLE_TOOL=$nativeHandleTool"
          Add-Content $env:GITHUB_ENV "TEMPO_FIXTURE_DIAGNOSTIC_DIR=$(Join-Path $pwd 'fixture-native-logs')"
      - name: Verify legacy data transactions and Windows lease behavior
        working-directory: tempo
        run: python -m unittest -q tests.test_legacy_migration tests.test_update_bootstrap tests.test_update_storage tests.test_update_migration tests.test_update_lock tests.test_update_components tests.test_update_coordinator tests.test_update_addons tests.test_nvidia_setup tests.test_windows_update_release tests.test_package_windows_updates tests.test_update_configuration tests.test_windows_installer_cleanup
      - name: Build production-feature candidate
        working-directory: velopack
        run: cargo build --locked --release -p velopack_bins --bin update --features windows --target x86_64-pc-windows-msvc --target-dir ../production-target
      - name: Build isolated fault-injection candidate
        working-directory: velopack
        run: cargo build --locked --release -p velopack_bins --bin update --features windows,tempo-fixture-faults --target x86_64-pc-windows-msvc --target-dir ../fixture-target
      - name: Run isolated native fixture
        env:
          PYTHONPATH: tempo
        run: python tempo/tests/fixtures/velopack/run_fixture.py --vpk-root vpk --fixture-updater fixture-target/x86_64-pc-windows-msvc/release/update.exe --report fixture-results.json
      - name: Require complete native recovery evidence
        if: ${{ !inputs.uninstall_diagnostics }}
        run: python tempo/tests/fixtures/velopack/recovery_gate.py fixture-results.json
      - name: Bind production-feature bytes to this native candidate run
        if: ${{ !inputs.uninstall_diagnostics }}
        run: |
          python -c @'
          import hashlib, json, os
          from pathlib import Path
          pin = json.loads(Path('tempo/installer/velopack/pin.json').read_bytes())
          updater = Path('production-target/x86_64-pc-windows-msvc/release/update.exe')
          identity = dict(schema_version=1, source_commit=os.environ['GITHUB_SHA'],
              upstream_commit=pin['upstream_commit'], patch_sha256=pin['patch_sha256'],
              updater_sha256=hashlib.sha256(updater.read_bytes()).hexdigest(),
              fixture_passed=True, certification_status='unverified',
              workflow_run_id=os.environ['GITHUB_RUN_ID'])
          Path('native-candidate.json').write_text(json.dumps(identity, indent=2) + '\n')
          '@
      - name: Transfer native candidate for full application packaging
        if: ${{ !inputs.uninstall_diagnostics }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: velopack-production-feature-candidate
          retention-days: 7
          path: |
            native-candidate.json
            production-target/x86_64-pc-windows-msvc/release/update.exe
            tempo/installer/velopack/pin.json
            tempo/installer/velopack/0001-tempo-recovery.patch
            tempo/installer/velopack/LICENSE
          if-no-files-found: error
      - name: Retain fixture evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: velopack-native-candidate-evidence
          path: |
            fixture-results.json
            fixture-native-logs/
            handle-signature.json
            production-target/x86_64-pc-windows-msvc/release/update.exe
          if-no-files-found: warn

  full-app-replay:
    if: ${{ inputs.full_app_source_run_id != '' }}
    uses: ./.github/workflows/velopack-full-app.yml
    with:
      source_run_id: ${{ inputs.full_app_source_run_id }}
