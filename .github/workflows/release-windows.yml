name: Build & Package Windows Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Exact application release tag (for example v1.0.2)'
        required: true
        type: string
      assemble_build_run:
        description: 'Completed Windows release build run ID to assemble and smoke-test'
        type: string
      assemble_source_commit:
        description: 'Exact source commit of the reviewed build run'
        type: string
      smoke_source_run:
        description: 'Optional assembly run whose exact installer should be smoke-tested again'
        type: string
      test_published_migration:
        description: 'Test upgrades to the published v1.0.2 installer'
        type: boolean
        default: false
      test_signed_updates:
        description: 'Test signed Windows updates and repair on isolated builds'
        type: boolean
        default: false
      signed_trial_source_run_id:
        description: 'Optional Actions run with the signed trial packages to reuse'
        type: string
      signed_trial_contract_sha256:
        description: 'SHA-256 of trial-contract.json when reusing signed trial packages'
        type: string

permissions:
  contents: read
  actions: read

env:
  QT_QPA_PLATFORM: offscreen
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: '1'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8:backslashreplace'
  HF_HUB_DISABLE_PROGRESS_BARS: '1'
  QT_API: pyqt6
  YOLO_AUTOINSTALL: 'false'

jobs:
  preflight:
    if: ${{ inputs.assemble_build_run == '' && !inputs.test_published_migration && !inputs.test_signed_updates }}
    uses: ./.github/workflows/windows-preflight.yml

  velopack-native:
    needs: preflight
    uses: ./.github/workflows/velopack-adoption.yml

  validate-source:
    name: Validate Windows source before packaging
    needs: [preflight, velopack-native]
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.13.16 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.16'
          architecture: x64
      - name: Check dependency source identities before downloading runtimes
        run: |
          python -c @'
          import json
          from pathlib import Path
          from scripts.prepare_dependency_sources import sha256_file
          from scripts.windows_build_profile import PROFILES
          for profile in PROFILES.values():
              expected = json.loads(Path(profile.source_manifest).read_text())['windows_lock_sha256']
              if sha256_file(profile.lock) != expected:
                  raise SystemExit(f'Lock checksum differs from reviewed sources: {profile.lock}')
              print(f'Verified source identity: {profile.key}')
          '@
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check release tag before building large runtimes
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $expected = & python -c "from tempo_release import VERSION; print('v' + VERSION)"
          if ($env:RELEASE_TAG -ne $expected) { throw "Release tag must be $expected" }
      - name: Install checksummed source-test dependencies
        timeout-minutes: 12
        run: |
          python -m venv .venv_build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv_build\Scripts\python.exe -m pip install --no-cache-dir --no-deps --require-hashes -r requirements-windows.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv_build\Scripts\python.exe -m scripts.windows_native_bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv_build\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Regenerate Colab notebook for source tests
        run: |
          & .\.venv_build\Scripts\python.exe -m notebooks.build_staged_colab_notebook
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run complete regression and scientific suites
        timeout-minutes: 22
        run: |
          & .\.venv_build\Scripts\python.exe -m scripts.windows_release_checks regressions --output Output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain source-test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows_test_evidence
          retention-days: 7
          path: |
            Output/regressions.log
            Output/*results.json
            Output/test-fonts.json
          if-no-files-found: error

  build-nvidia-runtime:
    name: Build optional NVIDIA inference runtime
    needs: validate-source
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      TEMPO_WINDOWS_PROFILE: nvidia-cu126
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.13.16 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.16'
          architecture: x64
      - name: Install pinned NVIDIA dependencies
        timeout-minutes: 25
        run: |
          New-Item -ItemType Directory -Force Output | Out-Null
          python -m venv .venv_nvidia
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv_nvidia\Scripts\python.exe -m pip install --no-cache-dir --no-deps --require-hashes -r requirements-windows-nvidia.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv_nvidia\Scripts\python.exe -m scripts.windows_native_bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv_nvidia\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv_nvidia\Scripts\python.exe -m scripts.windows_release_checks provenance --output Output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and verify NVIDIA worker with headless entrypoint smoke checks
        timeout-minutes: 60
        run: |
          & .\.venv_nvidia\Scripts\python.exe -m scripts.windows_release_checks run --log Output/nvidia-pyinstaller.log --timeout 3300 -- .\.venv_nvidia\Scripts\python.exe -m scripts.windows_packager tempo.spec --clean --noconfirm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv_nvidia\Scripts\python.exe -m scripts.windows_release_checks verify --executable dist/TEMPO/TEMPO.exe --report Output/nvidia-verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify CUDA bundle privacy and source notices
        run: |
          & .\.venv_nvidia\Scripts\python.exe -m scripts.check_repository --payload dist/TEMPO --report Output/nvidia-payload-privacy.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv_nvidia\Scripts\python.exe -m scripts.prepare_dependency_sources --lock requirements-windows-nvidia.lock --manifest installer/dependency-sources-nvidia.json --inventory Output/third-party-licenses/index.json --output Output/dependency-sources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create and verify publishable NVIDIA runtime parts
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          & .\.venv_nvidia\Scripts\python.exe -m scripts.package_nvidia_runtime --release-tag "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain runtime and descriptor for the CPU build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows_NVIDIA_runtime
          retention-days: 7
          compression-level: 0
          path: |
            Output/TEMPO_NVIDIA_Runtime_*.zip.part*
            Output/nvidia-runtime.json
          if-no-files-found: error

  build-windows:
    name: Test and build Windows payload
    runs-on: windows-2025
    needs: [build-nvidia-runtime, velopack-native]
    timeout-minutes: 180
    outputs:
      installer: ${{ steps.installer.outcome }}
      velopack: ${{ steps.velopack_payload.outcome }}
    steps:
      - name: Preserve pinned source and patch bytes
        run: git config --global core.autocrlf false
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.13.16 x64 without dependency caches
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.16'
          architecture: x64
      - name: Retrieve tested NVIDIA runtime descriptor and parts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Windows_NVIDIA_runtime
          path: Output
      - name: Verify the exact optional runtime for this revision
        run: |
          python -m scripts.package_nvidia_runtime --verify-descriptor Output/nvidia-runtime.json --commit "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install checksummed Windows wheels
        id: runtime
        timeout-minutes: 12
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Output | Out-Null
          python -m venv .venv_build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv_build\Scripts\python.exe -m pip install --no-cache-dir --no-deps --require-hashes -r requirements-windows.lock 2>&1 | Tee-Object Output/runtime-install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv_build\Scripts\python.exe -m scripts.windows_native_bundle 2>&1 | Tee-Object Output/native-environment.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv_build\Scripts\python.exe -m pip check 2>&1 | Tee-Object Output/pip-check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv_build\Scripts\python.exe -m scripts.windows_release_checks provenance --output Output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check repository privacy and file boundaries
        id: repository_checks
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        timeout-minutes: 6
        run: |
          & .\.venv_build\Scripts\python.exe -m scripts.check_repository --install-scanner "$env:RUNNER_TEMP\tempo-security"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv_build\Scripts\python.exe -m scripts.check_repository --staged --scanner "$env:RUNNER_TEMP\tempo-security\gitleaks.exe" --report Output/repository-privacy.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Regenerate Colab notebook from the tested revision
        id: notebook
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          & .\.venv_build\Scripts\python.exe -m scripts.windows_release_checks run --log Output/colab-notebook.log --timeout 60 -- .\.venv_build\Scripts\python.exe -m notebooks.build_staged_colab_notebook
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain generated Colab notebook
        id: notebook_artifact
        if: ${{ !cancelled() && steps.notebook.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TEMPO_Colab_Trainer
          retention-days: 7
          path: notebooks/TEMPO_Colab_Trainer.ipynb
          if-no-files-found: error
      - name: Run installer failure injections
        id: installer_tests
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: ./scripts/test_windows_installer.ps1
      - name: Render isolated Windows fixtures
        id: presentation
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        timeout-minutes: 12
        run: |
          $failed = $false
          foreach ($profile in @(@{name='ordinary';scale='1';font='10'},@{name='scaled';scale='1.5';font='14'},@{name='large';scale='2';font='24'})) {
            $env:QT_SCALE_FACTOR=$profile.scale
            & .\.venv_build\Scripts\python.exe -m scripts.windows_release_checks run --log "Output/screens-$($profile.name).log" --timeout 180 -- .\.venv_build\Scripts\python.exe -m scripts.render_ui_screens --output "Output/screens/$($profile.name)" --font-size $profile.font
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Verify source runtime
        id: source
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        timeout-minutes: 16
        run: |
          & .\.venv_build\Scripts\python.exe -m scripts.windows_release_checks run --log Output/source-verification.log --timeout 900 -- .\.venv_build\Scripts\python.exe tempo_gui.py --verify-installation Output/source-verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain prebuild diagnostics immediately
        id: prebuild_evidence
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows_prebuild_evidence
          retention-days: 3
          path: |
            Output/**/*.json
            Output/**/*.log
            Output/**/*.png
            Output/*.txt
          if-no-files-found: error
      - name: Build actual executable
        id: portable
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        timeout-minutes: 46
        run: |
          & .\.venv_build\Scripts\python.exe -m scripts.windows_release_checks run --log Output/pyinstaller.log --timeout 2700 -- .\.venv_build\Scripts\python.exe -m scripts.windows_packager tempo.spec --clean --noconfirm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check packaged application file boundaries
        id: payload_privacy
        if: ${{ !cancelled() && steps.portable.outcome == 'success' }}
        timeout-minutes: 4
        run: |
          & .\.venv_build\Scripts\python.exe -m scripts.check_repository --payload dist/TEMPO --report Output/payload-privacy.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify version-matched dependency source index
        id: dependency_sources
        if: ${{ !cancelled() && steps.portable.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          & .\.venv_build\Scripts\python.exe -m scripts.prepare_dependency_sources --inventory Output/third-party-licenses/index.json --output Output/dependency-sources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify portable executable, first-run handoff, and model helpers
        id: portable_check
        if: ${{ !cancelled() && steps.portable.outcome == 'success' }}
        timeout-minutes: 16
        run: |
          & .\.venv_build\Scripts\python.exe -m scripts.windows_release_checks verify --executable dist/TEMPO/TEMPO.exe --report Output/portable-verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain bundle diagnostics before installer compilation
        id: bundle_evidence
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows_bundle_evidence
          retention-days: 3
          path: |
            Output/**/*.json
            Output/**/*.log
            build/TEMPO/warn-TEMPO.txt
          if-no-files-found: error
      - name: Install checksummed Inno Setup 7.1.0 x64
        id: inno
        if: ${{ !cancelled() && steps.portable.outcome == 'success' }}
        run: |
          $compilerInstaller = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $compilerInstaller
          if ((Get-FileHash $compilerInstaller -Algorithm SHA256).Hash.ToLower() -ne '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f') { throw 'Compiler checksum mismatch' }
          $process = Start-Process $compilerInstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -PassThru
          if (-not $process.WaitForExit(180000)) { Stop-Process -Id $process.Id -Force; throw 'Compiler installation timed out' }
          if ($process.ExitCode -ne 0) { throw "Compiler installation failed: $($process.ExitCode)" }
          'C:\Program Files\Inno Setup 7' >> $env:GITHUB_PATH
      - name: Compile installer and identify payload
        id: installer
        if: ${{ !cancelled() && steps.portable.outcome == 'success' && steps.inno.outcome == 'success' }}
        timeout-minutes: 16
        run: |
          $version = (Get-Content Output/verification-contract.json -Raw | ConvertFrom-Json).version
          & .\.venv_build\Scripts\python.exe -m scripts.windows_release_checks run --log Output/inno-setup.log --timeout 900 -- iscc "/DMyAppVersion=$version" installer/tempo_setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $filename = "TEMPO_Setup_v$($version).exe"
          $hash = (Get-FileHash -LiteralPath "Output/$filename" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $filename" | Set-Content Output/SHA256SUMS.txt -Encoding utf8NoBOM
          "filename=$filename" >> $env:GITHUB_OUTPUT
          Copy-Item scripts/verify_windows_install.ps1,scripts/windows_installer_helpers.ps1 Output
      - name: Transfer installer even if an independent diagnostic failed
        id: payload
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows_install_payload
          retention-days: 3
          compression-level: 0
          path: |
            Output/${{ steps.installer.outputs.filename }}
            Output/SHA256SUMS.txt
            Output/verification-contract.json
            Output/build-provenance.json
            Output/verify_windows_install.ps1
            Output/windows_installer_helpers.ps1
            Output/dependency-sources/dependency-sources.json
            Output/dependency-sources/DEPENDENCY_SOURCES.md
            Output/dependency-sources/SHA256SUMS.txt
            Output/dependency-sources/source-verification.json
          if-no-files-found: error
      - name: Retrieve the native candidate from this workflow run
        if: ${{ !cancelled() && steps.portable_check.outcome == 'success' && steps.payload.outcome == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: velopack-production-feature-candidate
          path: native-candidate
      - name: Set up pinned packager runtime on the builder
        if: ${{ !cancelled() && steps.portable_check.outcome == 'success' && steps.payload.outcome == 'success' }}
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v4.3.1
        with:
          dotnet-version: '8.0.413'
      - name: Package complete disabled TEMPO Velopack candidates
        id: velopack
        if: ${{ !cancelled() && steps.portable_check.outcome == 'success' && steps.payload.outcome == 'success' }}
        timeout-minutes: 70
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $packager = Join-Path $env:RUNNER_TEMP 'tempo-vpk.1.2.161.nupkg'
          Invoke-WebRequest 'https://github.com/velopack/velopack/releases/download/1.2.161/vpk.1.2.161.nupkg' -OutFile $packager
          & .\.venv_build\Scripts\python.exe -m scripts.build_velopack_candidate --bundle dist/TEMPO --vpk-archive $packager --updater native-candidate/production-target/x86_64-pc-windows-msvc/release/update.exe --setup native-candidate/production-target/x86_64-pc-windows-msvc/release/setup.exe --native-evidence native-candidate/native-candidate.json --output Output/velopack-candidate --commit "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Transfer exact full application candidates
        id: velopack_payload
        if: ${{ !cancelled() && steps.velopack.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows_velopack_candidate_payload
          retention-days: 7
          compression-level: 0
          path: Output/velopack-candidate/*
          if-no-files-found: error
      - name: Retain verified CPU bundle for release assembly
        id: release_bundle
        if: ${{ !cancelled() && steps.velopack_payload.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows_release_bundle
          retention-days: 7
          include-hidden-files: true
          path: |
            dist/TEMPO/
            Output/portable-verification.json
            Output/verification-contract.json
          if-no-files-found: error
      - name: Aggregate required build gates
        id: build_gates
        if: ${{ always() }}
        env:
          GATE_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          & .\.venv_build\Scripts\python.exe -m scripts.windows_gates --output Output/build-gates.json runtime repository_checks notebook notebook_artifact installer_tests presentation source prebuild_evidence portable payload_privacy dependency_sources portable_check bundle_evidence inno installer payload velopack velopack_payload release_bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain all build evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows_build_evidence
          retention-days: 7
          path: |
            Output/**/*.json
            Output/**/*.log
            Output/**/*.png
            Output/*.txt
            build/**/warn-*.txt
            build/**/xref-*.html
          if-no-files-found: error

  verify-installed:
    name: Verify installer on a fresh Windows runner
    needs: build-windows
    if: ${{ !cancelled() && needs.build-windows.outputs.installer == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      # Deliberately no source checkout, setup-python, or runtime installation.
      - name: Download the exact built payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Windows_install_payload
          path: payload
      - name: Install in a path containing spaces
        id: install
        run: ./payload/verify_windows_install.ps1 -Mode install -Payload payload -Evidence evidence -Target "$env:RUNNER_TEMP\TEMPO installed verification"
      - name: Verify offline installed setup handoff and headless model helpers
        id: verify
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 16
        run: ./payload/verify_windows_install.ps1 -Mode verify -Payload payload -Evidence evidence -Target "$env:RUNNER_TEMP\TEMPO installed verification"
      - name: Remove application even after verification failure
        id: uninstall
        if: ${{ !cancelled() && steps.install.outcome != 'skipped' }}
        run: ./payload/verify_windows_install.ps1 -Mode uninstall -Payload payload -Evidence evidence -Target "$env:RUNNER_TEMP\TEMPO installed verification"
      - name: Aggregate installation gates
        if: ${{ always() }}
        env:
          GATE_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          $steps = $env:GATE_OUTCOMES | ConvertFrom-Json
          $gates = @{}
          foreach ($name in @('install','verify','uninstall')) { $gates[$name]=$steps.$name.outcome }
          $gates | ConvertTo-Json | Set-Content evidence/installation-gates.json -Encoding utf8NoBOM
          if (@($gates.Values | Where-Object { $_ -ne 'success' }).Count) { throw 'Required installation gates did not pass' }
      - name: Retain fresh-runner evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows_install_evidence
          retention-days: 7
          path: evidence/**
          if-no-files-found: error

  verify-velopack:
    name: Verify full TEMPO Velopack candidates on a fresh Windows runner
    needs: build-windows
    if: ${{ !cancelled() && needs.build-windows.outputs.velopack == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 100
    steps:
      # No source checkout, Python setup, .NET setup, or application dependencies.
      - name: Download exact full application candidates
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Windows_velopack_candidate_payload
          path: payload
      - name: Exercise installed full application and independent recovery
        id: matrix
        run: ./payload/verify_velopack_install.ps1 -Mode matrix -Payload payload -Evidence evidence
      - name: Exercise published legacy CPU installer migration and component refusal
        id: migration
        if: ${{ !cancelled() && steps.matrix.outcome == 'success' }}
        run: ./payload/verify_velopack_install.ps1 -Mode migration -Payload payload -Evidence evidence
      - name: Uninstall candidate and check retained state
        id: uninstall
        if: ${{ !cancelled() && steps.matrix.outcome != 'skipped' }}
        run: ./payload/verify_velopack_install.ps1 -Mode uninstall -Payload payload -Evidence evidence
      - name: Require complete evidence for the exact candidate artifacts
        if: ${{ !cancelled() }}
        run: ./payload/verify_velopack_install.ps1 -Mode gate -Payload payload -Evidence evidence
      - name: Retain full application candidate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows_velopack_candidate_evidence
          retention-days: 7
          path: |
            payload/candidate-contract.json
            evidence/*-result.json
            evidence/*-verification.json
            evidence/*-verification-probes/**/*.json
            evidence/*-shell-folders.json
            evidence/preserved-state.json
            evidence/**/*.log
          if-no-files-found: error

  replay-velopack:
    name: Replay exact TEMPO Velopack candidates on another fresh Windows runner
    needs: verify-velopack
    runs-on: windows-2025
    timeout-minutes: 100
    steps:
      # No source checkout, Python setup, .NET setup, or application dependencies.
      - name: Download exact full application candidates
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Windows_velopack_candidate_payload
          path: payload
      - name: Exercise installed full application and independent recovery
        id: matrix
        run: ./payload/verify_velopack_install.ps1 -Mode matrix -Payload payload -Evidence evidence
      - name: Exercise published legacy CPU installer migration and component refusal
        id: migration
        if: ${{ !cancelled() && steps.matrix.outcome == 'success' }}
        run: ./payload/verify_velopack_install.ps1 -Mode migration -Payload payload -Evidence evidence
      - name: Uninstall candidate and check retained state
        id: uninstall
        if: ${{ !cancelled() && steps.matrix.outcome != 'skipped' }}
        run: ./payload/verify_velopack_install.ps1 -Mode uninstall -Payload payload -Evidence evidence
      - name: Require complete evidence for the exact candidate artifacts
        if: ${{ !cancelled() }}
        run: ./payload/verify_velopack_install.ps1 -Mode gate -Payload payload -Evidence evidence
      - name: Retain full application candidate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows_velopack_candidate_replay_evidence
          retention-days: 7
          path: |
            payload/candidate-contract.json
            evidence/*-result.json
            evidence/*-verification.json
            evidence/*-verification-probes/**/*.json
            evidence/*-shell-folders.json
            evidence/preserved-state.json
            evidence/**/*.log
          if-no-files-found: error

  certify:
    name: Certify every required Windows gate
    needs: [preflight, validate-source, build-windows, verify-installed, velopack-native, verify-velopack, replay-velopack]
    if: ${{ always() && inputs.assemble_build_run == '' && !inputs.test_published_migration && !inputs.test_signed_updates }}
    runs-on: windows-2025
    steps:
      - name: Require complete build and clean installation success
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          SOURCE_RESULT: ${{ needs.validate-source.result }}
          BUILD_RESULT: ${{ needs.build-windows.result }}
          INSTALL_RESULT: ${{ needs.verify-installed.result }}
          NATIVE_RESULT: ${{ needs.velopack-native.result }}
          VELOPACK_RESULT: ${{ needs.verify-velopack.result }}
          REPLAY_RESULT: ${{ needs.replay-velopack.result }}
        run: |
          if ($env:PREFLIGHT_RESULT -ne 'success' -or $env:SOURCE_RESULT -ne 'success' -or $env:BUILD_RESULT -ne 'success' -or $env:INSTALL_RESULT -ne 'success' -or $env:NATIVE_RESULT -ne 'success' -or $env:VELOPACK_RESULT -ne 'success' -or $env:REPLAY_RESULT -ne 'success') { throw 'Windows build acceptance failed or required checks were skipped' }
          "Windows build checks passed for: $env:GITHUB_SHA. Velopack remains an unpublished, disabled candidate; this does not certify native adoption or rollout." >> $env:GITHUB_STEP_SUMMARY

  verify-published-migration:
    name: Test migration to the published Windows installer
    if: ${{ inputs.test_published_migration }}
    runs-on: windows-2025
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        migration: [direct, bridge]
    env:
      RELEASE_COMMIT: 4dc336fc8b655ed347a6a1e37a0ae944bf3502e3
    steps:
      - name: Check the release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:RELEASE_TAG -cne 'v1.0.2') { throw 'Published migration testing requires release tag v1.0.2' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Retrieve the original release and diagnostics contracts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: '42471873273'
          name: TEMPO_v1.0.2_stable_channel
          path: payload
      - name: Verify the contracts and fetch the published files
        env:
          GH_TOKEN: ${{ github.token }}
          MIGRATION_PATH: ${{ matrix.migration }}
        run: |
          $contractHash = (Get-FileHash payload/release-contract.json -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($contractHash -cne 'cef0a7ae7e69ead8b562427dad01a11123e317113e67d366a384e076f0a95a65') {
            throw 'Release contract differs from the Windows smoke test'
          }
          $diagnosticsHash = (Get-FileHash payload/verification-contract.json -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($diagnosticsHash -cne 'e9682278ddf68c08ad31c02c9c6e50d47030a26ffab10196da174aa3993dd0a0') {
            throw 'Diagnostics contract differs from the Windows smoke test'
          }
          function Get-ReleaseFiles([string]$Tag, [string[]]$Files) {
            $arguments = @('release','download',$Tag,'--repo','tempo-bio/TEMPO','--dir','payload','--clobber')
            foreach ($file in $Files) { $arguments += @('--pattern',$file) }
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              & gh @arguments
              if ($LASTEXITCODE -eq 0) { return }
              if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
            }
            throw "Could not download the required $Tag release files"
          }
          Get-ReleaseFiles 'v1.0.2' @('TEMPO_Setup_v1.0.2.exe','TEMPO.Bio.Desktop-1.0.2-full.nupkg','TEMPORepair.exe','tempo-update-v1.0.2.json')
          Get-ReleaseFiles 'v1.0.1' @('TEMPO_Setup_v1.0.1.exe')
          if ($env:MIGRATION_PATH -ceq 'bridge') {
            Get-ReleaseFiles 'v1.0.0' @('TEMPO_Setup_v1.0.0.exe')
          }
      - name: Run the upgrade with the published installer
        env:
          MIGRATION_PATH: ${{ matrix.migration }}
        run: |
          $bridge = $env:MIGRATION_PATH -ceq 'bridge'
          ./scripts/verify_velopack_install.ps1 -Mode release-migration -Payload payload -Evidence evidence -SourceCommit $env:RELEASE_COMMIT -ReleaseManifestSha256 89bbbdb9649f17a37ef7d8be87bb68b2a7fb7bbf1f42de5e46567c8accef9115 -LegacyBridge:$bridge
      - name: Retain migration results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TEMPO_v1.0.2_migration_${{ matrix.migration }}
          retention-days: 14
          path: |
            evidence/*-result.json
            evidence/*-verification.json
            evidence/*-verification-probes/**/*.json
            evidence/*-shell-folders.json
            evidence/preserved-state.json
            evidence/**/legacy-migration/*.json
            evidence/**/*.log
          if-no-files-found: warn

  build-signed-trial:
    name: Build a private TEMPO update trial version
    if: ${{ inputs.test_signed_updates && inputs.signed_trial_source_run_id == '' }}
    runs-on: windows-2025
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        ordinal: [1, 2, 3]
    env:
      TEMPO_WINDOWS_PROFILE: cpu
      ORDINAL: ${{ matrix.ordinal }}
    steps:
      - name: Check the release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:RELEASE_TAG -cne 'v1.0.2') { throw 'These signed trial builds are for v1.0.2 acceptance' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.16'
          architecture: x64
      - name: Prepare and verify the complete trial application
        run: |
          python -m scripts.prepare_windows_update_trial --ordinal $env:ORDINAL --output trial-source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv .venv_trial
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = (Resolve-Path .venv_trial/Scripts/python.exe).Path
          Push-Location trial-source
          try {
            $env:GITHUB_SHA = git rev-parse HEAD
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $python -m pip install --no-cache-dir --require-hashes --no-deps -r requirements-windows.lock
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $python -m scripts.windows_native_bundle
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $python -m pip check
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $python -m scripts.windows_release_checks provenance --output Output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $python -m scripts.windows_release_checks run --log Output/pack.log --timeout 3300 -- $python -m scripts.windows_packager tempo.spec --clean --noconfirm
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $python -m scripts.windows_release_checks verify --executable dist/TEMPO/TEMPO.exe --report Output/trial-verification.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
      - name: Retain the verified trial build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TEMPO_trial_build_${{ matrix.ordinal }}
          path: trial-source/dist/TEMPO/
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Retain build evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TEMPO_trial_build_evidence_${{ matrix.ordinal }}
          path: |
            trial-source/Output/*.json
            trial-source/Output/*.log
            trial-source/Output/trial-verification-probes/**/*.json
          retention-days: 14
          if-no-files-found: warn

  verify-signed-trial:
    name: Test signed updates, restart, and repair on Windows
    needs: build-signed-trial
    if: ${{ !cancelled() && inputs.test_signed_updates && (needs.build-signed-trial.result == 'success' || inputs.signed_trial_source_run_id != '') }}
    runs-on: windows-2025
    timeout-minutes: 95
    steps:
      - name: Check the trial inputs
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_RUN_ID: ${{ inputs.signed_trial_source_run_id }}
          CONTRACT_SHA256: ${{ inputs.signed_trial_contract_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RELEASE_TAG -cne 'v1.0.2') { throw 'The signed trial tests require release tag v1.0.2' }
          if ($env:SOURCE_RUN_ID) {
            if ($env:SOURCE_RUN_ID -notmatch '^[1-9][0-9]{0,19}$' -or $env:CONTRACT_SHA256 -cnotmatch '^[0-9a-f]{64}$') {
              throw 'Replaying signed packages requires a run ID and reviewed contract SHA-256'
            }
            $headers = @{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'}
            $source = Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN_ID" -Headers $headers
            if ($source.status -ne 'completed' -or $source.event -ne 'workflow_dispatch' -or
                $source.path -ne '.github/workflows/release-windows.yml' -or $source.head_branch -ne 'v1.0.2-dev' -or
                $source.head_repository.full_name -ne $env:GITHUB_REPOSITORY) {
              throw 'Use a completed trial run from the Windows release workflow on v1.0.2-dev'
            }
          } elseif ($env:CONTRACT_SHA256) {
            throw 'A trial contract SHA-256 requires the source run ID'
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.16'
          architecture: x64
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v4.3.1
        if: ${{ inputs.signed_trial_source_run_id == '' }}
        with:
          dotnet-version: '8.0.413'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ inputs.signed_trial_source_run_id == '' }}
        with:
          pattern: 'TEMPO_trial_build_[123]'
          path: trial-inputs
      - name: Retrieve the signed packages from the original trial
        if: ${{ inputs.signed_trial_source_run_id != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.signed_trial_source_run_id }}
          name: TEMPO_signed_trial_packages
          path: trial
      - name: Verify the reviewed trial contract
        if: ${{ inputs.signed_trial_source_run_id != '' }}
        env:
          CONTRACT_SHA256: ${{ inputs.signed_trial_contract_sha256 }}
        run: |
          $actual = (Get-FileHash trial/trial-contract.json -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $env:CONTRACT_SHA256) { throw 'The retained trial contract differs from the reviewed copy' }
      - name: Retrieve the exact tested v1.0.2 native tools
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: '42450240287'
          name: velopack-production-feature-candidate
          path: trial-native
      - name: Retrieve the pinned packager
        if: ${{ inputs.signed_trial_source_run_id == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            gh release download 1.2.161 --repo velopack/velopack --pattern vpk.1.2.161.nupkg --clobber
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { exit $LASTEXITCODE }
            Start-Sleep -Seconds (5 * $attempt)
          }
      - name: Install locked trial tools
        run: |
          python -m venv .venv_trial
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .venv_trial/Scripts/python.exe -m pip install --no-deps --require-hashes -r tests/fixtures/velopack/requirements-windows.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assemble private packages with an ephemeral test key
        if: ${{ inputs.signed_trial_source_run_id == '' }}
        run: |
          $native = 'trial-native/production-target/x86_64-pc-windows-msvc/release'
          & .venv_trial/Scripts/python.exe -m scripts.build_windows_update_trial --bundle trial-inputs/TEMPO_trial_build_1 trial-inputs/TEMPO_trial_build_2 trial-inputs/TEMPO_trial_build_3 --vpk-archive vpk.1.2.161.nupkg --native $native --output trial
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -LiteralPath trial-inputs -Recurse
      - name: Verify signed transfers, native replacement, and repair
        run: |
          $patcher = 'trial-native/production-target/x86_64-pc-windows-msvc/release/update.exe'
          & .venv_trial/Scripts/python.exe -m scripts.verify_windows_update_trial --trial trial --patcher $patcher --report Output/signed-trial-results.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain the test-only packages
        if: ${{ always() && inputs.signed_trial_source_run_id == '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TEMPO_signed_trial_packages
          path: trial/
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
      - name: Retain signed update and restart evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TEMPO_signed_trial_results
          path: |
            Output/signed-trial-results.json
            Output/trial-*-startup.json
            Output/trial-*-startup.log
          retention-days: 14
          if-no-files-found: warn

  assemble:
    name: Assemble the stable-channel Windows installer
    if: ${{ inputs.assemble_build_run != '' && inputs.smoke_source_run == '' && !inputs.test_published_migration && !inputs.test_signed_updates }}
    env:
      BUILD_RUN: ${{ inputs.assemble_build_run }}
      BUILD_COMMIT: ${{ inputs.assemble_source_commit }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    runs-on: windows-2025
    timeout-minutes: 65
    steps:
      - name: Confirm the completed source build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:BUILD_RUN -cnotmatch '^[0-9]+$' -or $env:BUILD_COMMIT -cnotmatch '^[0-9a-f]{40}$') {
              throw 'Supply the exact Windows build run ID and full commit SHA'
          }
          $run = Invoke-RestMethod -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN" -Headers @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
          }
          if ($run.head_sha -cne $env:BUILD_COMMIT -or $run.repository.full_name -cne $env:GITHUB_REPOSITORY -or
              $run.head_branch -cne $env:GITHUB_REF_NAME -or $run.event -cne 'workflow_dispatch' -or
              $run.path -cne '.github/workflows/release-windows.yml' -or $run.conclusion -cne 'success') {
              throw 'The run is not a successful Windows release build for this branch and commit'
          }
      - name: Preserve pinned source and patch bytes
        run: git config --global core.autocrlf false
      - name: Check out the tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BUILD_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.16'
          architecture: x64
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: '8.0.413'
      - name: Download build inputs and reviewed evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN }}
          pattern: '{Windows_release_bundle,velopack-production-feature-candidate,velopack-native-candidate-evidence,Windows_velopack_candidate_evidence,Windows_velopack_candidate_replay_evidence,Windows_test_evidence}'
          path: inputs
      - name: Install locked packaging dependencies and fetch the pinned packager
        run: |
          python -m pip install --require-hashes --no-deps -r tests/fixtures/velopack/requirements-windows.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest 'https://github.com/velopack/velopack/releases/download/1.2.161/vpk.1.2.161.nupkg' -OutFile vpk.nupkg
          if ((Get-FileHash vpk.nupkg -Algorithm SHA256).Hash.ToLowerInvariant() -cne '2b56ce117f803fc70c103cb423bd040e395e40370f6ff6e10818e9ff9c26a323') {
              throw 'Packager checksum mismatch'
          }
      - name: Verify source and binary identities and build the repair companion
        run: |
          @'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          def read(path):
              return json.loads(path.read_bytes())

          def digest(path):
              with path.open("rb") as file:
                  return hashlib.file_digest(file, "sha256").hexdigest()

          def require(condition, description):
              if not condition:
                  raise SystemExit(description)

          from tempo_release import VERSION

          commit = os.environ["BUILD_COMMIT"]
          require(os.environ["RELEASE_TAG"] == "v" + VERSION, "Release tag differs from the tested application version")
          require(subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == commit,
                  "Release source differs from the tested commit")
          inputs = Path("inputs")
          native = inputs / "velopack-production-feature-candidate"
          bins = native / "production-target/x86_64-pc-windows-msvc/release"
          updater, setup = bins / "update.exe", bins / "setup.exe"
          identity = read(native / "native-candidate.json")
          pin = read(Path("installer/velopack/pin.json"))
          require(identity["source_commit"] == commit
                  and str(identity["workflow_run_id"]) == os.environ["BUILD_RUN"]
                  and identity["upstream_commit"] == pin["upstream_commit"]
                  and identity["patch_sha256"] == pin["patch_sha256"]
                  and identity["fixture_passed"] is True and identity["production_passed"] is True
                  and digest(updater) == identity["updater_sha256"]
                  and digest(setup) == identity["setup_sha256"],
                  "Native candidate evidence differs from the exact updater/setup bytes")

          raw = inputs / "velopack-native-candidate-evidence"
          fixture_path, production_path = raw / "fixture-results.json", raw / "production-results.json"
          for report, switches in ((fixture_path, []), (production_path, ["--production"])):
              subprocess.run([sys.executable, "tests/fixtures/velopack/recovery_gate.py", str(report), *switches], check=True)
          production = read(production_path)
          require(production["updater_sha256"] == identity["updater_sha256"]
                  and production["setup_sha256"] == identity["setup_sha256"],
                  "Production recovery was run with different binaries")

          full_reports = []
          for name in ("Windows_velopack_candidate_evidence", "Windows_velopack_candidate_replay_evidence"):
              folder = inputs / name
              contract_path = folder / "payload/candidate-contract.json"
              report = folder / "evidence/gate-result.json"
              contract = read(contract_path)
              observed = read(report)
              require(observed["contract_sha256"] == digest(contract_path)
                      and contract["source_commit"] == commit
                      and observed["source_commit"] == commit and observed["success"] is True
                      and observed["release_certified"] is False,
                      "Full-app evidence failed or describes a different build")
              full_reports.append(report)
          source_report = inputs / "Windows_test_evidence/unittest-results.json"
          require(read(source_report)["success"] is True, "Windows source regressions did not pass")

          public = Path("stable-public-keys.json")
          public.write_bytes(b'{"tempo-stable-1": "4G5Gdmfrxu5bbK14sLuFla3XOGsimiEtFPtQcHqJ28Q="}\n')
          require(digest(public) == "92f5a51b932c66d4b3fc0a4b88491405ea231e83e5167219666433bb0e8d91d7",
                  "Public key file differs from the reviewed release trust map")
          subprocess.run([sys.executable, "-m", "scripts.build_update_repair", "--public-keys", str(public),
                          "--native-updater", str(updater), "--dist", "tools", "--work", "repair-work"], check=True)
          repair = Path("tools/TEMPORepair.exe")
          reviewed = dict(pin, certification_status="certified", updater_sha256=identity["updater_sha256"])
          Path("reviewed-pin.json").write_text(json.dumps(reviewed, sort_keys=True), encoding="utf-8")
          evidence = {
              "schema_version": 1, "source_commit": commit, "workflow_run_id": os.environ["BUILD_RUN"],
              "upstream_commit": pin["upstream_commit"], "patch_sha256": pin["patch_sha256"],
              "updater_sha256": digest(updater), "setup_sha256": digest(setup),
              "repair_sha256": digest(repair), "public_keys_sha256": digest(public),
              "checks": dict.fromkeys(pin["required_checks"], True),
              "reports": {
                  "native_faults": digest(fixture_path), "native_production": digest(production_path),
                  "full_app": digest(full_reports[0]), "full_app_replay": digest(full_reports[1]),
                  "source_regressions": digest(source_report),
              },
          }
          Path("native-evidence.json").write_text(json.dumps(evidence, sort_keys=True), encoding="utf-8")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assemble the stable-channel installer from the verified CPU bundle
        run: |
          $bundle = 'inputs/Windows_release_bundle'
          $contract = 'inputs/Windows_velopack_candidate_evidence/payload/candidate-contract.json'
          $tools = 'inputs/velopack-production-feature-candidate/production-target/x86_64-pc-windows-msvc/release'
          python -m scripts.build_velopack_release --bundle "$bundle/dist/TEMPO" --build-contract $contract --verification "$bundle/Output/verification-contract.json" --runtime-report "$bundle/Output/portable-verification.json" --vpk-archive vpk.nupkg --native-updater "$tools/update.exe" --setup "$tools/setup.exe" --public-keys stable-public-keys.json --repair-executable tools/TEMPORepair.exe --certification native-evidence.json --native-pin reviewed-pin.json --output assembled
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item stable-public-keys.json,reviewed-pin.json,native-evidence.json,"$tools/update.exe","$tools/setup.exe" assembled/
      - name: Retain the exact installer and its inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: TEMPO_${{ inputs.release_tag }}_stable_channel
          path: assembled/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  smoke:
    name: Smoke-test the exact stable-channel Windows installer
    needs: assemble
    if: ${{ !cancelled() && (needs.assemble.result == 'success' || (inputs.assemble_build_run != '' && inputs.smoke_source_run != '')) }}
    env:
      BUILD_COMMIT: ${{ inputs.assemble_source_commit }}
      SMOKE_SOURCE_RUN: ${{ inputs.smoke_source_run }}
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - name: Check out the reviewed smoke-test fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: ${{ inputs.smoke_source_run == '' }}
        with:
          name: TEMPO_${{ inputs.release_tag }}_stable_channel
          path: payload
      - name: Verify and retrieve the original assembly
        if: ${{ inputs.smoke_source_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:SMOKE_SOURCE_RUN -cnotmatch '^[0-9]+$' -or $env:BUILD_COMMIT -cnotmatch '^[0-9a-f]{40}$') {
              throw 'Supply a numeric assembly run ID and the full build commit'
          }
          $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SMOKE_SOURCE_RUN"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $source = Invoke-RestMethod -Uri $uri -Headers $headers
          $jobs = (Invoke-RestMethod -Uri "$uri/jobs" -Headers $headers).jobs
          if ($source.path -cne '.github/workflows/release-windows.yml' -or $source.head_branch -cne $env:GITHUB_REF_NAME -or
              $source.status -cne 'completed' -or -not ($jobs | Where-Object {
                  $_.name -ceq 'Assemble the stable-channel Windows installer' -and $_.conclusion -ceq 'success'
              })) { throw 'The selected run did not complete installer assembly on this branch' }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: ${{ inputs.smoke_source_run != '' }}
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.smoke_source_run }}
          name: TEMPO_${{ inputs.release_tag }}_stable_channel
          path: payload
      - name: Install, exercise, and remove the exact stable-channel installer
        run: ./payload/verify_velopack_install.ps1 -Mode release-smoke -Payload payload -Evidence evidence -SourceCommit $env:BUILD_COMMIT
      - name: Verify startup with data left by an older uninstall
        run: ./scripts/verify_velopack_install.ps1 -Mode release-smoke -Payload payload -Evidence leftover-evidence -SourceCommit $env:BUILD_COMMIT -LegacyUninstallLeftovers
      - name: Retain clean-runner evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: TEMPO_${{ inputs.release_tag }}_release_smoke
          path: |
            evidence/
            leftover-evidence/
          retention-days: 7
          if-no-files-found: warn
